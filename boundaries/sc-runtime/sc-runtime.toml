boundary_id = "BOUNDARY-sc-runtime"
owner_package = "sc-runtime"
owner_crate_path = "sc_runtime"
name = "sc-runtime"

[public]
facade = "Daemon, DaemonBuilder, DaemonConfig, RuntimeError, testing"
notes = "testing::DaemonFixture is behind the non-default test-util feature. There is no sc_runtime::AppName. NeedStores, NeedRoutes, and Ready are doc(hidden) typestate markers in the builder signature."

[implementation]
type = "library"
module = "sc_runtime"
visibility = "public"
constructor = "public"

[composition]
roots = ["Daemon", "DaemonBuilder", "DaemonConfig", "RuntimeError", "testing"]

[dependencies]
allowed_dependents = []
allowed_dependencies = [
  "sc-observability-types",
  "sc-transport",
  "sc-command",
  "axum",
  "tokio",
  "fd-lock",
  "utoipa",
  "utoipa-axum",
  "serde",
  "rmcp",
  "tracing",
]
# Full observability runtime and OTLP remain forbidden; cargo-tree contract
# tests enforce external package identities that sc-boundary cannot target.
forbidden_edges = [
  "sc-runtime -> sc-config",
  "sc-runtime -> sc-runtime-db-sqlite",
  "sc-runtime -> sc-cron",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = []
review_gates = []

[status]
state = "concrete_landed"
