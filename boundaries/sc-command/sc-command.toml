boundary_id = "BOUNDARY-sc-command"
owner_package = "sc-command"
owner_crate_path = "sc_command"
name = "sc-command"

[public]
facade = "Envelope, observability"

[implementation]
type = "marker"
module = "sc_command"
visibility = "public"
constructor = "none"

[composition]
roots = ["Envelope", "observability"]

# Production tool-package/import exclusion (normal + build, all production
# features) is checked by the production-tool-boundary companion. It resolves
# aliases/package identity and checks external/transitive cargo trees too;
# dev-only test/benchmark references remain permitted (REQ-RUN-0005).
[dependencies]
# Temporary neutral-port dependent; restore runtime-only after upstream proof.
# https://github.com/randlee/sc-runtime/issues/97
allowed_dependents = ["sc-runtime", "sc-cron"]
allowed_dependencies = ["serde", "serde_json", "sc-observability-types"]
# `sc-observability` and `sc-observability-otlp` are not workspace members.
# sc-lint 0.8.0 rejects a forbidden edge whose target is absent, so cargo tree
# enforces those edges. `sc-observability-types` is not a forbidden edge.
# `axum` and `rmcp` stay out of this table; cargo tree checks the `server` feature.
# `sc-cron` is a workspace member; the forbidden edge below keeps this crate off it.
forbidden_edges = [
  "sc-command -> sc-config",
  "sc-command -> sc-transport",
  "sc-command -> sc-runtime",
  "sc-command -> sc-runtime-db-sqlite",
  "sc-command -> sc-cron",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = []
review_gates = []

[status]
state = "concrete_landed"
