notes = "Feature monty exports an empty-default immutable application registry, open Send+Sync closure handlers, owned JSON call context, and opt-in sc_compose_run/atm_run configurations. Both adapters forward every nonempty command plus ordered string argv unchanged, with captured/selected cwd, one resolved immutable occurrence environment, row deadline, group/job termination and per-stream cap. The application owns synchronous handler cooperation. render_template is not a production registration or product requirement. Logger propagation retains B13 SharedCanonicalLog identity. process/PythonHook remain the general exported supervisor port; default tree excludes Monty and tool Rust packages."

