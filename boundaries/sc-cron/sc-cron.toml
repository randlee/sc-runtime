boundary_id = "BOUNDARY-sc-cron"
owner_package = "sc-cron"
owner_crate_path = "sc_cron"
name = "sc-cron"

[public]
facade = "Clock, CronError, CronExpr, DEFAULT_RELOAD_POLL, DueRun, Generation, HOOK_PROTOCOL, HookCall, HookEvent, HookOutput, HookStatus, HookTarget, is_identifier, JitterSource, Job, kill_budget, ManualClock, MAX_EXPR_LEN, MAX_HOOK_OUTPUT_BYTES, MAX_HOOK_SOURCE_BYTES, MAX_NAME_LEN, MAX_PAYLOAD_BYTES, MAX_TIMEOUT, MissedTickPolicy, NewSchedule, process, PythonHook, RunOutcome, RunTimeout, Schedule, ScheduleId, ScheduleName, ScheduleSpec, ScheduleStore, Scheduler, SCHEMA_VERSION, SeqJitter, SqliteScheduleStore, StopDecision, StoreError, StoreErrorKind, SystemClock, SystemJitter, Timestamp, WorkerHandle"
notes = "The facade lists every crate-root export, including feature test-utils names ManualClock and SeqJitter. process and PythonHook stay public: they are the retained REQ-CRON-0018 supervisor port (ChildSpec, supervise, and the related types), not an sc-runtime HTTP or MCP product. ScheduleStore stays open. Scheduler is generic over ScheduleStore, Clock, and JitterSource. HookTarget is Rust, Python { module }, or Monty { source }. StopDecision is Continue, Disable, Delete. sqlx is absent and is checked with cargo tree. sc-lint-boundary accepts only workspace package names, so monty and monty-types are not allowed_dependencies entries. The sc-cron-tree-default and sc-cron-tree-monty cargo-tree gates enforce that the default tree has no monty edge and that feature monty links monty and monty-types only."

[implementation]
type = "library"
module = "sc_cron"
visibility = "public"
constructor = "public"

[composition]
roots = ["Clock", "CronError", "CronExpr", "DEFAULT_RELOAD_POLL", "DueRun", "Generation", "HOOK_PROTOCOL", "HookCall", "HookEvent", "HookOutput", "HookStatus", "HookTarget", "is_identifier", "JitterSource", "Job", "kill_budget", "ManualClock", "MAX_EXPR_LEN", "MAX_HOOK_OUTPUT_BYTES", "MAX_HOOK_SOURCE_BYTES", "MAX_NAME_LEN", "MAX_PAYLOAD_BYTES", "MAX_TIMEOUT", "MissedTickPolicy", "NewSchedule", "process", "PythonHook", "RunOutcome", "RunTimeout", "Schedule", "ScheduleId", "ScheduleName", "ScheduleSpec", "ScheduleStore", "Scheduler", "SCHEMA_VERSION", "SeqJitter", "SqliteScheduleStore", "StopDecision", "StoreError", "StoreErrorKind", "SystemClock", "SystemJitter", "Timestamp", "WorkerHandle"]

[dependencies]
allowed_dependents = []
# The integration tests enable `test-utils` through a dev-dependency on this
# crate. That edge is not a runtime dependent.
allowed_dev_dependents = ["sc-cron"]
allowed_dev_dependencies = ["sc-cron"]
allowed_dependencies = [
  "async-trait",
  "chrono",
  "cron",
  "getrandom",
  "process-wrap",
  "rusqlite",
  "serde_json",
  "tempfile",
  "tokio",
  "tracing",
]
forbidden_edges = [
  "sc-cron -> sc-config",
  "sc-cron -> sc-transport",
  "sc-cron -> sc-command",
  "sc-cron -> sc-runtime",
  "sc-cron -> sc-runtime-db-sqlite",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = []
review_gates = []

[status]
state = "concrete_landed"
