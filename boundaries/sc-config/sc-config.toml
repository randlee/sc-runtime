notes = "AppName::new, AppName::env_prefix, load, Loader::new, Loader::load, ConfigError"

[implementation]
type = "marker"
module = "sc_config"
visibility = "public"
constructor = "none"

[composition]
roots = ["AppName", "load", "Loader", "ConfigError"]

[dependencies]
