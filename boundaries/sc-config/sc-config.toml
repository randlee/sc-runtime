# crates.io names (tokio, sc-observability, sc-observability-otlp,
# sc-observability-types) stay on the cargo tree check. sc-cron is a
# workspace member; the forbidden edge below keeps this crate off it.
forbidden_edges = [
  "sc-config -> sc-transport",
  "sc-config -> sc-command",
  "sc-config -> sc-runtime",
  "sc-config -> sc-runtime-db-sqlite",
  "sc-config -> sc-cron",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = []
review_gates = []

[status]
state = "concrete_landed"
