boundary_id = "BOUNDARY-sc-config"
owner_package = "sc-config"
owner_crate_path = "sc_config"
name = "sc-config"

[public]
facade = "sc_config::AppName, sc_config::ConfigError, sc_config::load, sc_config::Loader, sc_config::Layers, sc_config::Layer, sc_config::LayerSource, sc_config::Resolved, sc_config::FileSource, sc_config::EnvSource, sc_config::ValueSource, sc_config::Source, sc_config::SourceKind, sc_config::ResolvedRow, sc_config::StandardLayers, sc_config::StandardContext, sc_config::Slot"
notes = "AppName::new, AppName::env_prefix, load, Loader::new, Loader::load, ConfigError; layered engine: Layers, LayerSource, Layer, Resolved, FileSource, EnvSource, ValueSource; standard order: StandardLayers, StandardContext, Slot"

[implementation]
type = "marker"
module = "sc_config"
visibility = "public"
constructor = "none"

[composition]
roots = ["AppName", "load", "Loader", "ConfigError", "Layers", "Layer", "LayerSource", "Resolved", "FileSource", "EnvSource", "ValueSource", "Source", "SourceKind", "ResolvedRow", "StandardLayers", "StandardContext", "Slot"]

# Production tool-package/import exclusion (normal + build, all production
# features) is checked by the production-tool-boundary companion. It resolves
# aliases/package identity and checks external/transitive cargo trees too;
# dev-only test/benchmark references remain permitted (REQ-RUN-0005).
[dependencies]
allowed_dependents = []
allowed_dependencies = ["serde", "serde_json"]
# crates.io names (tokio, sc-observability, sc-observability-otlp,
# sc-observability-types) stay on the cargo tree check. sc-cron is a
# workspace member; the forbidden edge below keeps this crate off it.
forbidden_edges = [
  "sc-config -> sc-transport",
  "sc-config -> sc-command",
  "sc-config -> sc-runtime",
  "sc-config -> sc-runtime-db-sqlite",
  "sc-config -> sc-cron",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = []
review_gates = []

[status]
state = "concrete_landed"
