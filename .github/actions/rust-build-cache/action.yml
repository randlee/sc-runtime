name: Rust build cache
description: Partition dependency and build artifacts by job coverage and toolchains.
inputs:
  namespace:
    description: Job, fixture, target and feature coverage partition
    required: true
  toolchains:
    description: Exact Rust versions used by this job
    required: true
  target:
    description: Cargo target directory within this job's private cache
    default: generated
  compose:
    description: Install the pinned generation tool
    default: 'true'
  compose-version:
    description: Exact sc-compose release to install from GitHub (not crates.io compile)
    default: '1.7.0'
runs:
  using: composite
  steps:
    - name: Select private build directories
      shell: bash
      env:
        TARGET_PARTITION: ${{ inputs.target }}
      run: |
        set -euo pipefail
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target/$TARGET_PARTITION" >> "$GITHUB_ENV"
        echo "SC_RUNTIME_GENERATED_TARGET_DIR=$RUNNER_TEMP/cargo-target/generated" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
    # Never cache Cargo credentials, generated source, databases or tool venvs.
    # A commit suffix lets successful runs refresh immutable caches; the prefix
    # reuses dependencies on source-only changes. Cargo validates fingerprints.
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          ${{ runner.temp }}/cargo-target
        key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.namespace }}-${{ inputs.toolchains }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'sc-lint.toml') }}-${{ github.sha }}
        restore-keys: |
          rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.namespace }}-${{ inputs.toolchains }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'sc-lint.toml') }}-
    - uses: actions/cache@v4
      if: inputs.compose == 'true'
      id: compose-cache
      with:
        path: ${{ runner.temp }}/sc-compose
        key: sc-compose-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.compose-version }}-release-binary
    - name: Install sc-compose
      if: inputs.compose == 'true' && steps.compose-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SC_COMPOSE_VERSION: ${{ inputs.compose-version }}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/sc-compose"
        mkdir -p "$root"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) triple="x86_64-unknown-linux-gnu" ;;
          aarch64) triple="aarch64-unknown-linux-gnu" ;;
          *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
        esac
        archive="sc-compose_${SC_COMPOSE_VERSION}_${triple}.tar.gz"
        base="https://github.com/randlee/sc-compose/releases/download/v${SC_COMPOSE_VERSION}"
        curl -fsSL -o "$RUNNER_TEMP/${archive}" "${base}/${archive}"
        curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "${base}/checksums.txt"
        expected="$(awk -v file="$archive" '$2 == file { print $1; exit }' "$RUNNER_TEMP/checksums.txt")"
        test -n "$expected"
        echo "${expected}  $RUNNER_TEMP/${archive}" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/${archive}" -C "$root" --strip-components=1
    - name: Verify sc-compose and expose binary
      if: inputs.compose == 'true'
      shell: bash
      env:
        SC_COMPOSE_VERSION: ${{ inputs.compose-version }}
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/sc-compose/bin/sc-compose" --version | grep -Fx "sc-compose ${SC_COMPOSE_VERSION}"
        echo "$RUNNER_TEMP/sc-compose/bin" >> "$GITHUB_PATH"