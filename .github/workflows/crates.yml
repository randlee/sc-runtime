name: Crate CI

on:
  pull_request:
  push:
    branches:
      - integrate/phase-a
      - main

permissions:
  contents: read

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crates:
    name: just lint and just test
    runs-on: ubuntu-latest
    env:
      SC_RUNTIME_EPHEMERAL_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install generation test dependency
        run: python3 -m pip install -r requirements-generation.txt

      - name: Setup
        run: just setup

      - name: Lint
        run: just lint

      - name: Test
        run: just test
