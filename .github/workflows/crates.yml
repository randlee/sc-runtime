name: Crate CI

on:
  pull_request:
  push:
    branches:
      - integrate/phase-a
      - main

permissions:
  contents: read

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crates:
    name: just lint and just test
    runs-on: ubuntu-latest
    env:
      SC_RUNTIME_EPHEMERAL_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install generation test dependency
        run: python3 -m pip install -r requirements-generation.txt

      - name: Install cargo-generate
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) target="x86_64-unknown-linux-gnu" ;;
            aarch64) target="aarch64-unknown-linux-gnu" ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          url="https://github.com/cargo-generate/cargo-generate/releases/download/v0.25.1/cargo-generate-v0.25.1-${target}.tar.gz"
          curl -fsSL "$url" | tar xz -C "$HOME/.local/bin" cargo-generate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cargo generate --version | grep -F '0.25.1'

      - name: Install sc-compose
        run: cargo install sc-compose --version 1.7.0 --locked

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.21.2

      - name: Setup
        run: just setup

      # `just lint` runs the supply-chain recipe (`cargo deny check`, `cargo audit`).
      - name: Lint
        run: just lint

      - name: Test
        run: just test
