name: Template

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A new push to a pull request cancels the superseded template matrix.
concurrency:
  group: template-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) range_start="${{ github.event.pull_request.base.sha }}" ;;
            push)         range_start="${{ github.event.before }}" ;;
            *)            range_start="" ;;
          esac
          if [[ -z "$range_start" || "$range_start" =~ ^0+$ ]] || ! git cat-file -e "$range_start^{commit}" 2>/dev/null; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/scripts/ci_scope.py "$range_start" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  fixtures:
    name: list fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List wizard fixtures
        id: list
        run: |
          set -euo pipefail
          names=$(python3 -c 'import json, pathlib; print(json.dumps(sorted(path.name for path in pathlib.Path("wizard/fixtures").glob("*.json"))))')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  generate:
    name: ${{ matrix.fixture }}
    needs: [fixtures, ci-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJson(needs.fixtures.outputs.names) }}
    steps:
      - name: Documentation-only runtime skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Template generation is intentionally skipped for documentation-only changes."

      - name: Checkout
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install just
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin" --tag 1.58.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install jsonschema
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python3 -m pip install -r requirements-generation.txt

      - name: Install cargo-generate
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) target="x86_64-unknown-linux-gnu" ;;
            aarch64) target="aarch64-unknown-linux-gnu" ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          url="https://github.com/cargo-generate/cargo-generate/releases/download/v0.25.1/cargo-generate-v0.25.1-${target}.tar.gz"
          curl -fsSL "$url" | tar xz -C "$HOME/.local/bin" cargo-generate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cargo generate --version | grep -F '0.25.1'

      - name: Install sc-compose
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo install sc-compose --version 1.7.0 --locked

      # A tag selects the driver's release mode (no checkout path patch).
      - name: Generate
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        env:
          SC_RUNTIME_RELEASE: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: just new "$RUNNER_TEMP/app" --var-file "wizard/fixtures/${{ matrix.fixture }}" ${{ github.ref_type != 'tag' && '--development-observability' || '' }}

      # ADR-RUN-0401 point 6 runs these recipes inside `just new`. Point 8
      # requires this job to run them again as an independent proof.
      - name: Consumer recipes
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          just setup
          just lint
          just test
          just build-cli
          just build-daemon

      - name: Workspace check
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        working-directory: ${{ runner.temp }}/app
        run: SQLX_OFFLINE=true cargo check --workspace

      # REQ-RUN-0331 success criterion 2. Store layouts default the flag on, so
      # this sqlite-mcp job is the one that compiles CLI, MCP, and HTTP with it off.
      - name: Store layout general-db disable
        if: ${{ needs.ci-scope.outputs.runtime == 'true' && matrix.fixture == 'sqlite-mcp.json' }}
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          SQLX_OFFLINE=true cargo test -p widget-app-cli --no-default-features --lib general_db_off_omits_delete_commands
          SQLX_OFFLINE=true cargo test -p widget-app-daemon --no-default-features --lib openapi_paths_omit_general_delete
          SQLX_OFFLINE=true cargo test -p widget-app-cli --no-default-features --test widget_mcp

  plain-cargo-generate:
    name: plain cargo generate
    needs: ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Documentation-only runtime skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Plain cargo generate is intentionally skipped for documentation-only changes."

      - name: Checkout
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install cargo-generate
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) target="x86_64-unknown-linux-gnu" ;;
            aarch64) target="aarch64-unknown-linux-gnu" ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          url="https://github.com/cargo-generate/cargo-generate/releases/download/v0.25.1/cargo-generate-v0.25.1-${target}.tar.gz"
          curl -fsSL "$url" | tar xz -C "$HOME/.local/bin" cargo-generate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cargo generate --version | grep -F '0.25.1'

      - name: Generate without the driver
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plain"
          printf '%s\n' '[values]' 'db = "sqlite"' 'mcp = true' 'licence = "MIT"' > "$RUNNER_TEMP/values.toml"
          cargo generate --path template --template-values-file "$RUNNER_TEMP/values.toml" --name widget-app --destination "$RUNNER_TEMP/plain" --init --silent --allow-commands --force --no-workspace

      - name: Apply the checkout patch
        if: ${{ needs.ci-scope.outputs.runtime == 'true' && github.ref_type != 'tag' }}
        run: python3 scripts/new_project.py --patch-checkout "$RUNNER_TEMP/plain" --development-observability

      - name: Build
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        working-directory: ${{ runner.temp }}/plain
        run: cargo build --workspace

  isolated-signal-lifecycle:
    name: isolated signal lifecycle
    needs: ci-scope
    if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SC_RUNTIME_GHA_EPHEMERAL_SIGNAL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin" --tag 1.58.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install generation dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-generation.txt
          cargo install sc-compose --version 1.7.0 --locked
          mkdir -p "$HOME/.local/bin"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) target="x86_64-unknown-linux-gnu" ;;
            aarch64) target="aarch64-unknown-linux-gnu" ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cargo-generate/cargo-generate/releases/download/v0.25.1/cargo-generate-v0.25.1-${target}.tar.gz" | tar xz -C "$HOME/.local/bin" cargo-generate
      - name: Exercise real daemon signals
        run: just test lifecycle-signal
