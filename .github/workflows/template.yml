name: Template

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    name: list fixtures
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List wizard fixtures
        id: list
        run: |
          set -euo pipefail
          names=$(python3 -c 'import json, pathlib; print(json.dumps(sorted(path.name for path in pathlib.Path("wizard/fixtures").glob("*.json"))))')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  generate:
    name: ${{ matrix.fixture }}
    needs: fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJson(needs.fixtures.outputs.names) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.25.1 --locked

      - name: Install sc-compose
        run: cargo install sc-compose --version 1.7.0 --locked

      - name: Generate
        run: just new "$RUNNER_TEMP/app" --var-file "wizard/fixtures/${{ matrix.fixture }}"

      - name: Consumer recipes
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          just setup
          just lint
          just test
          just build-cli
          just build-daemon

  plain-cargo-generate:
    name: plain cargo generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.25.1 --locked

      - name: Generate without the driver
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plain"
          printf '%s\n' '[values]' 'db = "sqlite"' 'mcp = true' 'licence = "MIT"' > "$RUNNER_TEMP/values.toml"
          cargo generate --path template --template-values-file "$RUNNER_TEMP/values.toml" --name widget-app --destination "$RUNNER_TEMP/plain" --init --silent --force --no-workspace

      - name: Apply the checkout patch
        run: python3 scripts/new_project.py --patch-checkout "$RUNNER_TEMP/plain"

      - name: Build
        working-directory: ${{ runner.temp }}/plain
        run: cargo build --workspace
