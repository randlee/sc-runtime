[package]
name = "sc-transport"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Endpoint resolution and local HTTP for a daemon and its CLI."
readme = "README.md"
exclude = ["boundaries"]

[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Rand Lee"]
edition = "2024"
homepage = "https://github.com/randlee/sc-runtime"
license = "MIT"
repository = "https://github.com/randlee/sc-runtime"
rust-version = "1.94.1"

[features]
default = []
server = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", optional = true, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[[test]]
name = "app_name"
path = "tests/app_name.rs"

[[test]]
name = "resolve"
path = "tests/resolve.rs"

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "server"
path = "tests/server.rs"
required-features = ["server"]
