[package]
name = "sc-runtime-db-sqlite"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "One rusqlite connection on one writer thread."
readme = "README.md"

[dependencies]
# 0.39 resolves libsqlite3-sys 0.37, which sqlx 0.9 sqlite can link
# (`>=0.30.1, <0.38.0`). 0.40 pulls libsqlite3-sys 0.38 and cannot share a
# process with template store-sqlite. Default features stay off: `cache` is
# rusqlite's statement cache, and this crate does not use it. `bundled`
# builds SQLite here. The resolve fixture proves one libsqlite3-sys.
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
