[package]
name = "sc-runtime-db-sqlite"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "One rusqlite connection on one writer thread."
readme = "README.md"
publish = false

[dependencies]
# 0.41 resolves libsqlite3-sys 0.39 (RUSTSEC-2026-0459 fix), which sqlx 0.9.1
# sqlite can link (`>=0.30.1, <0.41.0`). 0.42 pulls libsqlite3-sys 0.40 and
# cannot share a process with template store-sqlite. Default features stay off: `cache` is
# rusqlite's statement cache, and this crate does not use it. `bundled`
# builds SQLite here. The resolve fixture proves one libsqlite3-sys.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
