[package]
name = "cron-logging-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately isolated: workspace feature unification cannot supply the port.
[workspace]

[dependencies]
sc-cron = { version = "0.2.0", path = "../../.." }

[dev-dependencies]
sc-cron = { version = "0.2.0", path = "../../..", features = ["test-utils"] }
async-trait = "0.1"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
