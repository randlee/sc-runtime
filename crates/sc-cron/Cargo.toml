[package]
name = "sc-cron"
description = "SQLite-backed cron scheduler with generation fencing, jitter and missed-tick replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sc-cron"
publish = false
keywords = ["cron", "scheduler", "sqlite", "tokio"]
categories = ["date-and-time", "asynchronous"]

[features]
# Deterministic `ManualClock` and `SeqJitter` for tests of this crate and of
# its callers.
test-utils = []
# In-process trusted hooks. Off by default, so a normal build does not link
# the interpreter. `monty-types` is direct because the feed uses its limits.
monty = ["dep:monty", "dep:monty-types"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cron = "0.17"
getrandom = "0.4"
# 0.39 resolves libsqlite3-sys 0.37, which can share a process with sqlx 0.9.
# Default features stay off. `bundled` builds SQLite here.
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
serde_json = "1"
# Per-invocation temporary working directory for a Python hook.
tempfile = "3"
# `process` and `io-util` run a hook child and read its capped output.
tokio = { version = "1", features = ["macros", "process", "io-util", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
# Spawns a hook in a Unix process group or a Windows job object so the kill
# reaches grandchildren too; wraps the safe parts of the platform calls so
# this crate keeps `forbid(unsafe_code)`.
process-wrap = { version = "10", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object"] }
monty = { version = "1.4.0", optional = true }
monty-types = { version = "1.4.0", optional = true }

[dev-dependencies]
# Self-reference so a plain `cargo test` builds the integration tests with
# `test-utils`; no `required-features` gate silently skips them.
sc-cron = { version = "0.1.0", path = ".", features = ["test-utils"] }
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }

# Two processes share one database file, so the test runs a copy of itself as
# the peer; it needs its own `main`.
[[test]]
name = "two_process"
harness = false

# Monty integration tests link the interpreter. The default `cargo test` skips
# this target; `cargo test -p sc-cron --features monty` builds it.
[[test]]
name = "monty_hook"
required-features = ["monty"]

[[test]]
name = "sc_compose_hook"

[[test]]
name = "sc_compose_bench"
required-features = ["monty"]
