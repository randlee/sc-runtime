[package]
name = "sc-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Daemon assembly: singleton lock, one router, and graceful shutdown."
readme = "README.md"

[features]
default = []
# In-process `testing::DaemonFixture` and its temporary-directory crate.
# A production daemon build leaves this feature off.
test-util = ["dep:tempfile"]

[dependencies]
sc-observability-types.workspace = true
sc-transport = { path = "../sc-transport", version = "0.1.1", features = ["server"] }
sc-command = { path = "../sc-command", version = "0.1.1", features = ["server"] }
axum = { version = "0.8.9", features = ["http1", "json", "macros", "tokio"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
fd-lock = "4"
utoipa = "5"
utoipa-axum = "0.2.0"
serde = { version = "1", features = ["derive"] }
rmcp = { version = "~3.7", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
tracing = "0.1"
tempfile = { version = "3", optional = true }

[dev-dependencies]
sc-observability-types = { workspace = true, features = ["test-util"] }
axum = { version = "0.8.9", features = ["http1", "json", "macros", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "~3.7", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
utoipa = "5"
utoipa-axum = "0.2.0"

[[test]]
name = "assembly"
path = "tests/assembly.rs"
required-features = ["test-util"]

[[test]]
name = "signals"
path = "tests/signals.rs"
required-features = ["test-util"]
