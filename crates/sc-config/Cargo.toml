[package]
name = "sc-config"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Synchronous JSON configuration loader with environment overrides."
readme = "README.md"
# Process tests autodiscover src/bin/sc-config-load-helper.rs in this checkout.
# The directory is excluded so `cargo install sc-config` does not ship that helper.
exclude = ["src/bin/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
