[package]
name = "sc-command"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lossless JSON CLI/API response envelope and REST/MCP conversions."
readme = "README.md"

[features]
default = []
server = ["dep:axum", "dep:rmcp"]
# Std-only canonical receivers for downstream tests; never activates server.
test-util = []

[dependencies]
# ADR-RUN-0017 fixed-validator bridge; remove with upstream capability cleanup.
# https://github.com/randlee/sc-runtime/issues/97
sc-observability-types = "=1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", optional = true, default-features = false }
rmcp = { version = "~3.7", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "server"
required-features = ["server"]
