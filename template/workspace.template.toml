[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "{{licence}}"
publish = false
rust-version = "1.94.1"

[workspace.dependencies]
sc-config = { version = "0.1.1" }
sc-transport = { version = "0.1.1" }
sc-command = { version = "0.1.1" }
sc-runtime = { version = "0.1.1" }
sc-cron = { version = "0.1.1" }
sc-observability = { version = "1.5.1" }
sc-observability-types = { version = "1.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
schemars = "1"
utoipa = "5"
