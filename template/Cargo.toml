[workspace]
resolver = "2"
members = ["crates/*"]
# cargo-generate replaces this file with workspace.template.toml, which has
# no exclude. These crates stay out of the template workspace: daemon's
# manifest is still a cargo-generate template, and service depends on the
# unpublished sc-* crates until the checkout patch runs.
exclude = ["crates/cli", "crates/daemon", "crates/service"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "{{licence}}"
publish = false
rust-version = "1.94.1"

[workspace.dependencies]
sc-config = { version = "0.1.1" }
sc-transport = { version = "0.1.1" }
sc-command = { version = "0.1.1" }
sc-runtime = { version = "0.1.1" }
sc-cron = { version = "0.1.1" }
sc-observability = { version = "1.5.1" }
sc-observability-types = { version = "1.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
schemars = "1"
utoipa = "5"
