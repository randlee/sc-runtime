[workspace]
resolver = "2"
members = [
    "crates/api-types",
    "crates/store-sqlite",
    "crates/service",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "{{licence}}"
publish = false
rust-version = "1.94.1"

[workspace.dependencies]
sc-config = { version = "0.1.0" }
sc-transport = { version = "0.1.0" }
sc-command = { version = "0.1.0" }
sc-runtime = { version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
schemars = "1"
utoipa = "5"
