[template]
cargo_generate_version = ">=0.23.0"
exclude = ["AGENTS.md.j2", "CLAUDE.md.j2"]

[placeholders.db]
type = "string"
prompt = "Database?"
default = "sqlite"
choices = ["sqlite", "postgres", "both"]

[placeholders.mcp]
type = "bool"
prompt = "Include MCP?"
default = true

[placeholders.licence]
type = "string"
prompt = "Licence?"
default = "MIT"

[conditional.'mcp == false']
ignore = [
    "crates/daemon/src/mcp.rs",
    "crates/cli/tests/widget_mcp.rs",
]
