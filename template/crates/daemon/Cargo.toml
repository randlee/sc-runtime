[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
{% if db == "none" %}
default = []
{% else %}
default = ["general-db"]
{% endif %}
general-db = []
cron = ["dep:sc-cron"]
monty = ["cron", "sc-cron/monty"]

[dependencies]
api-types = { path = "../api-types", features = ["schema"] }
service = { path = "../service" }
clap.workspace = true
sc-command = { workspace = true, features = ["server"] }
sc-config.workspace = true
sc-cron = { workspace = true, optional = true }
sc-observability-types.workspace = true
sc-observability.workspace = true
sc-runtime.workspace = true
sc-transport.workspace = true
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
{% if mcp %}
rmcp = { version = "~3.7", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
{% endif %}
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum = "0.2.0"

[[bin]]
name = "{{project-name}}-daemon"
path = "src/main.rs"
