[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
{% if mcp %}default = ["mcp"]{% else %}default = []{% endif %}
mcp = []

[dependencies]
api-types = { path = "../api-types" }
service = { path = "../service" }
sc-command = { workspace = true, features = ["server"] }
sc-config.workspace = true
sc-observability = "1.5.0"
sc-runtime.workspace = true
sc-transport.workspace = true
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
rmcp = { version = "~3.7", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
utoipa.workspace = true
utoipa-axum = "0.2.0"

[[bin]]
name = "{{project-name}}-daemon"
path = "src/main.rs"
