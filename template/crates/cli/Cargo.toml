[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
{% if db == "none" %}
default = []
{% else %}
default = ["general-db"]
{% endif %}
general-db = []

[dependencies]
api-types = { path = "../api-types" }
clap.workspace = true
sc-command.workspace = true
sc-config.workspace = true
sc-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
daemon = { path = "../daemon" }
sc-runtime = { workspace = true, features = ["test-util"] }
sc-transport = { workspace = true, features = ["server"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service = { path = "../service" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"
