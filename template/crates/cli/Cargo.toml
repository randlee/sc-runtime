[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
{% if db == "none" %}
default = [{% if cron_commands %}"cron-commands"{% endif %}]
{% else %}
default = ["general-db"{% if cron_commands %}, "cron-commands"{% endif %}]
{% endif %}
# The daemon dev-dependency is feature-off unless this flag is on, so
# `cargo test -p <cli> --no-default-features` drops delete row on all three
# surfaces of a store layout.
general-db = ["daemon/general-db"]
cron-commands = ["dep:sc-cron-commands", "daemon/cron-commands"]

[dependencies]
api-types = { path = "../api-types", version = "0.1.1" }
clap.workspace = true
sc-command.workspace = true
sc-cron-commands = { workspace = true, optional = true }
sc-config.workspace = true
sc-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
daemon = { path = "../daemon", version = "0.1.1", default-features = false }
sc-runtime = { workspace = true, features = ["test-util"] }
sc-transport = { workspace = true, features = ["server"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service = { path = "../service", version = "0.1.1" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"
