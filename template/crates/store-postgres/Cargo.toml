[package]
name = "store-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
schema = { path = "../schema" }
futures-util = "0.3.31"
serde_json.workspace = true
# Direct pin. Engine features differ per store crate, and this sprint does not
# edit the workspace manifest. Beads run-ze5 tracks a later workspace hoist.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "sqlx-toml",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
