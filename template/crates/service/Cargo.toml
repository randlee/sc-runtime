[package]
name = "service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
{% if db == "none" %}
default = []
{% else %}
default = ["general-db"]
{% endif %}
general-db = []

[dependencies]
api-types = { path = "../api-types", version = "0.1.1" }
{% if db != "none" %}
schema = { path = "../schema", version = "0.1.1" }
{% endif %}
{% if db == "sqlite" %}
store-sqlite = { path = "../store-sqlite", version = "0.1.1" }
{% elsif db == "postgres" %}
store-postgres = { path = "../store-postgres", version = "0.1.1" }
{% elsif db == "mysql" %}
store-mysql = { path = "../store-mysql", version = "0.1.1" }
{% elsif db == "sqlite-postgres" or db == "sqlite-mysql" %}
store-adaptor = { path = "../store-adaptor", version = "0.1.1" }
{% endif %}
sc-command.workspace = true
{% if cron_commands %}
sc-cron-commands = { workspace = true, features = ["schema"] }
{% endif %}
sc-observability-types.workspace = true
serde_json.workspace = true

[dev-dependencies]
{% if db == "none" %}
tokio = { workspace = true, features = ["macros", "rt"] }
{% endif %}
