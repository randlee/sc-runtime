[package]
name = "spike-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "Disposable spike CLI. Default features do not link Axum, rmcp, or sqlx."

[[bin]]
name = "spike-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sc-transport = { path = "../../../crates/sc-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spike-stack = { path = "../stack" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
