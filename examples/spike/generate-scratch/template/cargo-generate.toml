[template]
cargo_generate_version = ">=0.23.0"
exclude = ["AGENTS.md.j2"]

[placeholders.project_label]
type = "string"
prompt = "Project label?"
default = "demo"

[placeholders.use_extra]
type = "bool"
prompt = "Include the extra file?"
default = true

[placeholders.tags]
type = "array"
prompt = "Tags?"
choices = ["alpha", "beta", "one", "two"]
default = ["alpha", "beta"]

[conditional.'use_extra == false']
ignore = ["extra.txt"]
