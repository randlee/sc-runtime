[package]
name = "spike-server"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "Disposable spike server. Enables spike-stack's server feature."

[[bin]]
name = "spike-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
spike-stack = { path = "../stack", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
