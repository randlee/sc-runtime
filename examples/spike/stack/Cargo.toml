[package]
name = "spike-stack"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "Disposable Phase A compatibility spike library."

[features]
default = []
server = [
    "dep:anyhow",
    "dep:axum",
    "dep:rmcp",
    "dep:schemars",
    "dep:sc-observability",
    "dep:sc-observability-types",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio",
    "dep:utoipa",
    "dep:utoipa-axum",
]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

anyhow = { version = "1", optional = true }
axum = { version = "0.8.9", optional = true, features = ["http1", "json", "tokio"] }
rmcp = { version = "~3.7", optional = true, default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
schemars = { version = "1", optional = true }
sc-observability = { version = "1.5.0", optional = true }
sc-observability-types = { version = "1.5.0", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1", optional = true, features = ["macros", "net", "rt-multi-thread"] }
utoipa = { version = "5", optional = true }
utoipa-axum = { version = "0.2.0", optional = true }

[dev-dependencies]
tempfile = "3"
