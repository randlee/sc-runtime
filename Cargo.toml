[workspace]
resolver = "2"
members = [
    "crates/sc-config",
    "crates/sc-transport",
    "crates/sc-command",
    "crates/sc-runtime",
    "crates/sc-cron",
    "crates/sc-runtime-db-sqlite",
]

[workspace.package]
version = "0.1.1"
authors = ["Rand Lee"]
edition = "2024"
homepage = "https://github.com/randlee/sc-runtime"
license = "MIT"
repository = "https://github.com/randlee/sc-runtime"
rust-version = "1.94.1"

[workspace.dependencies]
sc-observability-types = "1.5.0"
