# Managed by sc-lint; regenerate with `sc-lint init --just`, then re-apply
# sc-runtime maintainer profiles below (REQ-RUN-0004 / REQ-RUN-0005).
[tool.sc-lint]
minimum_version = "0.8.0"

# Source-maintainer checks (this repository). Generated applications use the
# consumer template from sprint a-6 with the same minimum_version floor.
# Boundary lint command: `sc-lint lint sc-boundary`.
[[tool.sc-lint.lint]]
name = "boundary"
command = ["sc-lint", "lint", "sc-boundary", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "line-counts"
command = ["sc-lint", "lint", "line-counts", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "fmt"
command = ["cargo", "fmt", "--all", "--check"]

[[tool.sc-lint.lint]]
name = "clippy"
command = ["cargo", "clippy", "--workspace", "--exclude", "sc-cron", "--all-targets", "--", "-D", "warnings", "-D", "clippy::await_holding_lock"]

# `monty` 1.4 requires rustc 1.96; workspace MSRV stays 1.94.1 for the rest.
[[tool.sc-lint.lint]]
name = "clippy-sc-cron"
command = ["bash", "-lc", "rustup run 1.96.1 cargo clippy -p sc-cron --all-targets --features monty -- -D warnings -D clippy::await_holding_lock"]

[[tool.sc-lint.lint]]
name = "sc-portability"
command = ["sc-lint", "lint", "sc-portability", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "sc-runtime"
command = ["sc-lint", "lint", "sc-runtime", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "function-length"
command = ["sc-lint", "lint", "function-length", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "identity-literals"
command = ["sc-lint", "lint", "identity-literals", "--root", ".", "--config", "sc-lint.toml"]

[[tool.sc-lint.lint]]
name = "compatibility"
command = ["sc-lint", "compatibility", "check", "--config", "sc-lint.toml"]

# Re-apply after `sc-lint init --just`. The recipe uses {{python}}.
[[tool.sc-lint.lint]]
name = "adr-run-0011"
command = ["just", "adr-run-0011"]

# Bundled SQLite does not cross-compile on this xwin toolchain: cc-rs looks
# for `llvm-lib` and it is not on PATH. `sc-runtime-db-sqlite` and `sc-cron`
# both enable rusqlite's `bundled` feature, so both stay out of the Windows
# cross check until that link exists. Later sprints drop the excludes:
#   cargo xwin check --workspace --target x86_64-pc-windows-msvc
#   cargo xwin clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings -D clippy::await_holding_lock
[[tool.sc-lint.lint]]
name = "xwin-check"
command = ["cargo", "xwin", "check", "--workspace", "--exclude", "sc-runtime-db-sqlite", "--exclude", "sc-cron", "--target", "x86_64-pc-windows-msvc"]

[[tool.sc-lint.lint]]
name = "xwin-clippy"
command = ["cargo", "xwin", "clippy", "--workspace", "--exclude", "sc-runtime-db-sqlite", "--exclude", "sc-cron", "--all-targets", "--target", "x86_64-pc-windows-msvc", "--", "-D", "warnings", "-D", "clippy::await_holding_lock"]

[tool.sc-lint.lint_profiles]
# Fast boundary-only pass while leaf crates land (a-2..a-4).
gates = ["boundary", "line-counts"]
# Full maintainer gate once the workspace exists (a-5+).
full = ["boundary", "line-counts", "fmt", "clippy", "clippy-sc-cron", "sc-portability", "sc-runtime", "function-length", "identity-literals", "compatibility", "adr-run-0011", "xwin-check", "xwin-clippy"]

[tool.sc-lint.analyzers.portability]
exclude_rules = []
fail_rules = ["PORT-001", "PORT-002", "PORT-003", "PORT-004", "PORT-005", "PORT-006", "PORT-007", "PORT-008", "PORT-009", "PORT-010"]

[tool.sc-lint.analyzers.runtime]
exclude_rules = []
fail_rules = ["SCB-RUNTIME-001", "SCB-RUNTIME-002"]

[identities]
forbidden_literals = []

# Non-test lines under crates/*/src. Key from sc-lint 0.8.0 line-counts.
[line_counts]
max_production_lines = 1000
paths = ["crates/*/src/**/*.rs", "template/**/*.rs"]

[[tool.sc-lint.test]]
name = "workspace"
command = ["cargo", "test", "--workspace", "--exclude", "sc-cron"]

[[tool.sc-lint.test]]
name = "sc-cron-default"
command = ["cargo", "test", "-p", "sc-cron"]

[[tool.sc-lint.test]]
name = "sc-config"
command = ["cargo", "test", "-p", "sc-config"]

[[tool.sc-lint.test]]
name = "sc-transport-default"
command = ["cargo", "test", "-p", "sc-transport"]

[[tool.sc-lint.test]]
name = "sc-command-default"
command = ["cargo", "test", "-p", "sc-command"]

[[tool.sc-lint.test]]
name = "sc-runtime-default"
command = ["cargo", "test", "-p", "sc-runtime"]

[[tool.sc-lint.test]]
name = "sc-transport-server"
command = ["cargo", "test", "-p", "sc-transport", "--features", "server"]

[[tool.sc-lint.test]]
name = "sc-command-server"
command = ["cargo", "test", "-p", "sc-command", "--features", "server"]

[[tool.sc-lint.test]]
name = "sc-runtime-test-util"
command = ["cargo", "test", "-p", "sc-runtime", "--features", "test-util"]

[[tool.sc-lint.test]]
name = "generation"
command = ["python3", "scripts/run_generation_tests.py"]

[[tool.sc-lint.test]]
name = "sc-cron-monty"
command = ["bash", "-lc", "rustup run 1.96.1 cargo test -p sc-cron --features monty"]

[[tool.sc-lint.test]]
name = "sc-cron-tree-default"
command = ["bash", "-lc", "tree=$(cargo tree -p sc-cron -e normal --prefix none); echo \"$tree\" | grep -Eq '^monty' && exit 1; echo \"$tree\" | grep -Eq '^sqlx' && exit 1; echo \"$tree\" | grep -Eq '^sc-(config|transport|command|runtime)' && exit 1; true"]

[[tool.sc-lint.test]]
name = "sc-cron-tree-monty"
command = ["bash", "-lc", "tree=$(rustup run 1.96.1 cargo tree -p sc-cron --features monty -e normal --prefix none); echo \"$tree\" | grep -Eq '^monty ' || exit 1; echo \"$tree\" | grep -Eq '^monty-types ' || exit 1; echo \"$tree\" | grep -Eq 'monty-pool|monty-fs|monty-runtime' && exit 1; echo \"$tree\" | grep -Eq '^sc-(config|transport|command|runtime)' && exit 1; true"]
